db_path: data/gas_monitoring.db
table_name: gas_monitoring
processed_data_path: data/processed/preprocessed_data.csv
model_output_dir: models

random_state: 42
test_size: 0.2
smote_sampling_strategy: not majority
smote_k_neighbors: 5
run_group_generalization_check: true

current_numeric_features:
  - Temperature
  - Temperature_x_Humidity
  - co2_ratio
  - avg_metal_oxide

important_ts_prefixes:
  - Temperature_
  - CO2_InfraredSensor_
  - MetalOxideSensor_Unit1_
  - MetalOxideSensor_Unit2_
  - avg_metal_oxide_
  - co2_ratio_

models:
  RandomForest:
    n_estimators: 300
    random_state: 42
    n_jobs: -1
  DecisionTree:
    max_depth: 8
    min_samples_leaf: 25
    random_state: 42
  LogisticRegression:
    solver: lbfgs
    max_iter: 2000
    random_state: 42
  XGBoost:
    objective: multi:softprob
    num_class: 3
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    eval_metric: mlogloss
    random_state: 42
    n_jobs: -1
  LightGBM:
    objective: multiclass
    num_class: 3
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.85
    colsample_bytree: 0.85
    random_state: 42
    n_jobs: -1
    verbose: -1
  CatBoost:
    iterations: 300
    depth: 4
    learning_rate: 0.05
    loss_function: MultiClass
    random_seed: 42
    verbose: false
